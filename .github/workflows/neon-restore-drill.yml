name: Neon Restore Drill

on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:

concurrency:
  group: chargeopt-neon-restore-drill
  cancel-in-progress: false

jobs:
  restore-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "psycopg[binary]>=3.2,<4"
      - name: Point-in-time restore drill
        run: python scripts/neon_restore_drill.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
