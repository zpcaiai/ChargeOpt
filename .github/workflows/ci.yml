name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: zpcaiai/chargeopt

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff>=0.4,<1"
      - name: Run ruff check
        run: ruff check chargeopt/ tests/ scripts/
      - name: Run ruff format check
        run: ruff format --check chargeopt/ tests/ scripts/

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      CHARGEOPT_SKIP_DB_MIGRATION: "1"
      DATABASE_URL: ""
      API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        shell: bash
        timeout-minutes: 5
        run: pytest --cov=chargeopt --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Docker build & push (GHCR)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  migrate-neon:
    name: Neon migrations
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install migration dependencies
        run: pip install -r api/requirements.txt
      - name: Verify DATABASE_URL secret
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL GitHub secret is required for automatic Neon migrations."
            exit 1
          fi
      - name: Run Neon migrations
        run: python scripts/migrate.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  verify-vercel:
    name: Verify Vercel Git deployment
    runs-on: ubuntu-latest
    needs: [build, migrate-neon]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    timeout-minutes: 12
    env:
      VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL || 'https://chargeopt-os.vercel.app' }}
    steps:
      - name: Wait for the pushed revision to become healthy
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            payload="$(curl --fail --silent --show-error --max-time 20 "${VERCEL_PRODUCTION_URL%/}/health" || true)"
            revision="$(jq -r '.revision // empty' <<<"$payload" 2>/dev/null || true)"
            status="$(jq -r '.status // empty' <<<"$payload" 2>/dev/null || true)"
            database="$(jq -r '.db // empty' <<<"$payload" 2>/dev/null || true)"
            if [ "$revision" = "$GITHUB_SHA" ] && [ "$status" = "ok" ] && [ "$database" = "ok" ]; then
              printf 'Verified Vercel production revision %s with healthy Neon connectivity.\n' "$revision"
              exit 0
            fi
            printf 'Attempt %s/60: deployed=%s status=%s db=%s\n' "$attempt" "${revision:-unknown}" "${status:-unknown}" "${database:-unknown}"
            sleep 10
          done
          echo "::error::Vercel production did not expose healthy revision $GITHUB_SHA within 10 minutes."
          exit 1
