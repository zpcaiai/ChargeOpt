[project]
name = "chargeopt"
version = "1.0.0"
description = "ChargeOpt OS Enterprise – multi-station charging energy dispatch and VPP optimization."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic-settings>=2.3,<3",
  "structlog>=24.1,<25",
  "prometheus-client>=0.20,<1",
  "slowapi>=0.1.9,<1",
  "aiofiles>=23.0,<25",
  "psycopg[binary,pool]>=3.2,<4",
  "scipy>=1.14,<2",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project.scripts]
chargeopt = "chargeopt.__main__:main"
chargeopt-worker = "chargeopt.worker:main"
chargeopt-vpp-worker = "chargeopt.vpp_operations:main"
chargeopt-edge = "chargeopt.edge_runtime:main"

[project.optional-dependencies]
edge = [
  "ocpp>=2.1,<3",
  "paho-mqtt>=2.1,<3",
  "pymodbus>=3.11,<4",
  "websockets>=15,<16",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5.0,<6",
  "pytest-asyncio>=1.4,<2",
  "httpx>=0.27,<1",
  "ruff>=0.4,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=chargeopt --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["chargeopt"]
omit = ["chargeopt/server.py"]
